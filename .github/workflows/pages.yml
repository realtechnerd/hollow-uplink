# Publishes public/ (the public demo built by tools/build_public.py) to GitHub Pages.
# Only public/ is uploaded: simulated machines, throwaway keys, no broker.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Public demo

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: No private files in the site
        run: |
          if find public -name '*.key' -o -name '*.env' | grep -q .; then echo "Private file in public/"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
